<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="1280" height="720" fill="#0a0a0a"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="68" height="720" fill="#111111"/>

  <!-- Sidebar logo: red play triangle -->
  <polygon points="22,18 22,42 46,30" fill="#e50914"/>

  <!-- Sidebar icon: Home (active) -->
  <rect x="14" y="68" width="40" height="40" rx="8" fill="#e50914" opacity="0.15"/>
  <!-- Home icon -->
  <polygon points="34,74 50,86 50,106 18,106 18,86" fill="none" stroke="#e50914" stroke-width="2"/>
  <rect x="28" y="94" width="12" height="12" fill="#e50914" rx="1"/>

  <!-- Sidebar icon: Search -->
  <rect x="14" y="124" width="40" height="40" rx="8" fill="none"/>
  <circle cx="34" cy="140" r="8" fill="none" stroke="#888888" stroke-width="2"/>
  <line x1="40" y1="146" x2="48" y2="154" stroke="#888888" stroke-width="2" stroke-linecap="round"/>

  <!-- Sidebar icon: Library -->
  <rect x="14" y="180" width="40" height="40" rx="8" fill="none"/>
  <rect x="21" y="187" width="4" height="26" fill="#888888" rx="1"/>
  <rect x="28" y="190" width="4" height="23" fill="#888888" rx="1"/>
  <rect x="35" y="185" width="4" height="28" fill="#888888" rx="1"/>
  <rect x="42" y="192" width="4" height="21" fill="#888888" rx="1"/>

  <!-- Sidebar icon: Settings -->
  <rect x="14" y="236" width="40" height="40" rx="8" fill="none"/>
  <circle cx="34" cy="256" r="7" fill="none" stroke="#888888" stroke-width="2"/>
  <circle cx="34" cy="256" r="2.5" fill="#888888"/>
  <line x1="34" y1="244" x2="34" y2="248" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="264" x2="34" y2="268" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="256" x2="26" y2="256" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="256" x2="46" y2="256" stroke="#888888" stroke-width="2" stroke-linecap="round"/>

  <!-- Spotlight Banner -->
  <rect x="68" y="0" width="1212" height="340" fill="#1a1a1a"/>

  <!-- Backdrop gradient overlay: dark on left, transparent right -->
  <defs>
    <linearGradient id="spotlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0a0a0a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="backdropImg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a3a"/>
      <stop offset="50%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
    <linearGradient id="posterGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a3a"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="posterGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a1a"/>
      <stop offset="100%" stop-color="#1a0d0d"/>
    </linearGradient>
    <linearGradient id="posterGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#0d1a0d"/>
    </linearGradient>
    <linearGradient id="posterGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a1a"/>
      <stop offset="100%" stop-color="#1a1a0d"/>
    </linearGradient>
    <linearGradient id="posterGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="posterGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a2a"/>
      <stop offset="100%" stop-color="#1a0d1a"/>
    </linearGradient>
  </defs>

  <!-- Backdrop image simulation -->
  <rect x="68" y="0" width="1212" height="340" fill="url(#backdropImg)"/>

  <!-- Stars scattered in backdrop -->
  <circle cx="900" cy="40" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="950" cy="80" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="1000" cy="30" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="1050" cy="60" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="1100" cy="100" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="1150" cy="50" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="1200" cy="90" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="850" cy="120" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="1000" cy="150" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="1150" cy="140" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="1250" cy="70" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- Planet silhouette in backdrop -->
  <circle cx="1100" cy="180" r="100" fill="#0d1520" opacity="0.7"/>
  <ellipse cx="1100" cy="180" rx="150" ry="18" fill="none" stroke="#1e3a5a" stroke-width="2" opacity="0.5"/>

  <!-- Gradient overlay on backdrop -->
  <rect x="68" y="0" width="1212" height="340" fill="url(#spotlightGrad)"/>

  <!-- Bottom fade for banner -->
  <defs>
    <linearGradient id="bannerBottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="68" y="240" width="1212" height="100" fill="url(#bannerBottomFade)"/>

  <!-- Spotlight content: left side -->
  <!-- Rating badge -->
  <rect x="100" y="80" width="52" height="20" rx="4" fill="#f5c518" opacity="0.15"/>
  <text x="108" y="94" font-size="11" fill="#f5c518" font-weight="600">IMDb</text>

  <!-- Title -->
  <text x="100" y="155" font-size="42" font-weight="800" fill="#f1f1f1" letter-spacing="3">INTERSTELLAR</text>

  <!-- Meta row -->
  <text x="100" y="182" font-size="14" fill="#888888">2014</text>
  <text x="136" y="182" font-size="14" fill="#555555">·</text>
  <text x="148" y="182" font-size="14" fill="#888888">2h 49m</text>
  <text x="210" y="182" font-size="14" fill="#555555">·</text>
  <text x="222" y="182" font-size="14" fill="#f5c518">8.6 ★</text>
  <text x="270" y="182" font-size="14" fill="#555555">·</text>
  <text x="282" y="182" font-size="14" fill="#888888">PG</text>

  <!-- Overview -->
  <text x="100" y="208" font-size="14" fill="#cccccc">A team of explorers travel through a wormhole in space in an attempt to ensure humanity's</text>
  <text x="100" y="228" font-size="14" fill="#cccccc">survival. Directed by Christopher Nolan.</text>

  <!-- Buttons -->
  <rect x="100" y="252" width="148" height="42" rx="6" fill="#e50914"/>
  <text x="124" y="278" font-size="15" font-weight="700" fill="#ffffff">▶  Watch Now</text>

  <rect x="260" y="252" width="140" height="42" rx="6" fill="#333333"/>
  <text x="285" y="278" font-size="15" font-weight="600" fill="#f1f1f1">ⓘ  More Info</text>

  <!-- Section: Trending Movies -->
  <text x="100" y="370" font-size="18" font-weight="700" fill="#f1f1f1">Trending Movies</text>
  <rect x="100" y="375" width="140" height="3" rx="1" fill="#e50914"/>

  <!-- 6 Movie Cards Row 1 -->
  <!-- Card 1 -->
  <rect x="100" y="385" width="140" height="210" rx="8" fill="#1a1a1a"/>
  <rect x="100" y="385" width="140" height="160" rx="8" fill="url(#posterGrad1)"/>
  <rect x="100" y="533" width="140" height="12" rx="0" fill="#1a1a1a"/>
  <text x="110" y="549" font-size="12" font-weight="600" fill="#f1f1f1">Oppenheimer</text>
  <text x="110" y="565" font-size="11" fill="#888888">2023 · Biography</text>
  <!-- Play overlay -->
  <circle cx="170" cy="465" r="18" fill="#000000" opacity="0.5"/>
  <polygon points="164,458 164,472 178,465" fill="#ffffff" opacity="0.9"/>

  <!-- Card 2 -->
  <rect x="252" y="385" width="140" height="210" rx="8" fill="#1a1a1a"/>
  <rect x="252" y="385" width="140" height="160" rx="8" fill="url(#posterGrad2)"/>
  <rect x="252" y="533" width="140" height="12" rx="0" fill="#1a1a1a"/>
  <text x="262" y="549" font-size="12" font-weight="600" fill="#f1f1f1">The Batman</text>
  <text x="262" y="565" font-size="11" fill="#888888">2022 · Action</text>
  <circle cx="322" cy="465" r="18" fill="#000000" opacity="0.5"/>
  <polygon points="316,458 316,472 330,465" fill="#ffffff" opacity="0.9"/>

  <!-- Card 3 -->
  <rect x="404" y="385" width="140" height="210" rx="8" fill="#1a1a1a"/>
  <rect x="404" y="385" width="140" height="160" rx="8" fill="url(#posterGrad3)"/>
  <rect x="404" y="533" width="140" height="12" rx="0" fill="#1a1a1a"/>
  <text x="414" y="549" font-size="12" font-weight="600" fill="#f1f1f1">Avatar: Way of Water</text>
  <text x="414" y="565" font-size="11" fill="#888888">2022 · Sci-Fi</text>
  <circle cx="474" cy="465" r="18" fill="#000000" opacity="0.5"/>
  <polygon points="468,458 468,472 482,465" fill="#ffffff" opacity="0.9"/>

  <!-- Card 4 -->
  <rect x="556" y="385" width="140" height="210" rx="8" fill="#1a1a1a"/>
  <rect x="556" y="385" width="140" height="160" rx="8" fill="url(#posterGrad4)"/>
  <rect x="556" y="533" width="140" height="12" rx="0" fill="#1a1a1a"/>
  <text x="566" y="549" font-size="12" font-weight="600" fill="#f1f1f1">Dune: Part Two</text>
  <text x="566" y="565" font-size="11" fill="#888888">2024 · Sci-Fi</text>
  <circle cx="626" cy="465" r="18" fill="#000000" opacity="0.5"/>
  <polygon points="620,458 620,472 634,465" fill="#ffffff" opacity="0.9"/>

  <!-- Card 5 -->
  <rect x="708" y="385" width="140" height="210" rx="8" fill="#1a1a1a"/>
  <rect x="708" y="385" width="140" height="160" rx="8" fill="url(#posterGrad5)"/>
  <rect x="708" y="533" width="140" height="12" rx="0" fill="#1a1a1a"/>
  <text x="718" y="549" font-size="12" font-weight="600" fill="#f1f1f1">Poor Things</text>
  <text x="718" y="565" font-size="11" fill="#888888">2023 · Drama</text>
  <circle cx="778" cy="465" r="18" fill="#000000" opacity="0.5"/>
  <polygon points="772,458 772,472 786,465" fill="#ffffff" opacity="0.9"/>

  <!-- Card 6 -->
  <rect x="860" y="385" width="140" height="210" rx="8" fill="#1a1a1a"/>
  <rect x="860" y="385" width="140" height="160" rx="8" fill="url(#posterGrad6)"/>
  <rect x="860" y="533" width="140" height="12" rx="0" fill="#1a1a1a"/>
  <text x="870" y="549" font-size="12" font-weight="600" fill="#f1f1f1">Past Lives</text>
  <text x="870" y="565" font-size="11" fill="#888888">2023 · Romance</text>
  <circle cx="930" cy="465" r="18" fill="#000000" opacity="0.5"/>
  <polygon points="924,458 924,472 938,465" fill="#ffffff" opacity="0.9"/>

  <!-- Fade-right edge for cards row -->
  <defs>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="960" y="385" width="320" height="210" fill="url(#fadeRight)"/>

  <!-- Section: Trending Series -->
  <text x="100" y="622" font-size="18" font-weight="700" fill="#f1f1f1">Trending Series</text>
  <rect x="100" y="627" width="130" height="3" rx="1" fill="#e50914"/>

  <!-- Sidebar bottom user avatar -->
  <circle cx="34" cy="695" r="16" fill="#333333"/>
  <text x="34" y="700" font-size="12" fill="#888888" text-anchor="middle">U</text>

</svg>
