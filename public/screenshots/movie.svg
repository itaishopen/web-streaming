<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1810"/>
      <stop offset="100%" stop-color="#2c2810"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0a0a0a" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bannerFadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="posterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2810"/>
      <stop offset="100%" stop-color="#1a1808"/>
    </linearGradient>
    <linearGradient id="playerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="progressBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#ff2020"/>
    </linearGradient>
    <linearGradient id="navGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect x="68" y="0" width="1212" height="360"/>
    </clipPath>
    <filter id="posterShadow" x="-10%" y="-5%" width="130%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0a0a0a"/>

  <!-- ── SIDEBAR ─────────────────────────────────── -->
  <rect x="0" y="0" width="68" height="720" fill="#111111"/>
  <polygon points="20,16 20,44 46,30" fill="#e50914"/>
  <rect x="10" y="60" width="48" height="1" fill="#222"/>

  <!-- Home icon -->
  <polygon points="34,84 44,93 44,106 24,106 24,93" fill="none" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="34,84 46,95 22,95" fill="#555"/>
  <rect x="28" y="96" width="12" height="10" rx="1" fill="#555"/>

  <!-- Search icon -->
  <circle cx="34" cy="155" r="7" fill="none" stroke="#555" stroke-width="1.8"/>
  <line x1="39" y1="160" x2="45" y2="166" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Library icon -->
  <rect x="22" y="210" width="4" height="18" rx="1" fill="#555"/>
  <rect x="30" y="207" width="4" height="21" rx="1" fill="#555"/>
  <rect x="38" y="212" width="8" height="16" rx="1" fill="#555"/>

  <!-- Settings icon -->
  <circle cx="34" cy="295" r="5.5" fill="none" stroke="#555" stroke-width="1.8"/>
  <path d="M34 280 L34 283.5 M34 306.5 L34 310 M19 295 L22.5 295 M45.5 295 L49 295 M23.5 284.5 L26 287 M42 303 L44.5 305.5 M23.5 305.5 L26 303 M42 287 L44.5 284.5" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>

  <text x="34" y="124" fill="#555" font-size="9" text-anchor="middle">HOME</text>
  <text x="34" y="178" fill="#555" font-size="9" text-anchor="middle">SEARCH</text>
  <text x="34" y="238" fill="#555" font-size="9" text-anchor="middle">LIBRARY</text>
  <text x="34" y="318" fill="#555" font-size="9" text-anchor="middle">SETTINGS</text>

  <!-- ── BANNER ──────────────────────────────────── -->
  <rect x="68" y="0" width="1212" height="360" fill="url(#bannerBg)" clip-path="url(#bannerClip)"/>
  <!-- Desert/sand texture hints -->
  <g clip-path="url(#bannerClip)" opacity="0.3">
    <ellipse cx="1050" cy="180" rx="300" ry="180" fill="#c8a040" opacity="0.2"/>
    <ellipse cx="1150" cy="300" rx="200" ry="100" fill="#a07020" opacity="0.25"/>
    <!-- Sand dune lines -->
    <path d="M700 320 Q900 280 1280 310" stroke="#b08030" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M700 340 Q950 300 1280 330" stroke="#b08030" stroke-width="1.5" fill="none" opacity="0.2"/>
  </g>
  <rect x="68" y="0" width="1212" height="360" fill="url(#bannerGrad)" clip-path="url(#bannerClip)"/>
  <rect x="68" y="280" width="1212" height="80" fill="url(#bannerFadeBottom)" clip-path="url(#bannerClip)"/>

  <!-- Poster card -->
  <rect x="96" y="52" width="150" height="225" rx="10" fill="url(#posterGrad)" filter="url(#posterShadow)"/>
  <!-- Poster detail -->
  <rect x="104" y="70" width="134" height="80" rx="4" fill="#2a2818" opacity="0.8"/>
  <text x="171" y="116" fill="#c8a040" font-size="28" font-weight="800" text-anchor="middle" opacity="0.6">DUNE</text>
  <rect x="104" y="158" width="134" height="2" fill="#c8a040" opacity="0.3"/>
  <rect x="104" y="168" width="134" height="95" rx="4" fill="#1e1810" opacity="0.7"/>
  <text x="171" y="220" fill="#c8a040" font-size="11" font-weight="600" text-anchor="middle" opacity="0.5">PART TWO</text>

  <!-- Banner text content (right of poster) -->
  <!-- Title -->
  <text x="268" y="90" fill="#f1f1f1" font-size="36" font-weight="800" letter-spacing="2">DUNE: PART TWO</text>

  <!-- Genre pills -->
  <rect x="268" y="102" width="58" height="22" rx="11" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="297" y="117" fill="#bbb" font-size="11" text-anchor="middle">Sci-Fi</text>
  <rect x="334" y="102" width="78" height="22" rx="11" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="373" y="117" fill="#bbb" font-size="11" text-anchor="middle">Adventure</text>
  <rect x="420" y="102" width="52" height="22" rx="11" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="446" y="117" fill="#bbb" font-size="11" text-anchor="middle">Epic</text>

  <!-- Meta -->
  <text x="268" y="148" fill="#888" font-size="13">2024  ·  2h 46m  ·</text>
  <text x="404" y="148" fill="#f5c518" font-size="13" font-weight="600">8.4 ★</text>
  <text x="437" y="148" fill="#888" font-size="13">·  PG-13</text>

  <!-- Overview -->
  <text x="268" y="176" fill="#ccc" font-size="13">Paul Atreides unites with Chani and the Fremen while seeking revenge against the</text>
  <text x="268" y="194" fill="#ccc" font-size="13">conspirators who destroyed his family. An epic continuation of the saga of Dune.</text>

  <!-- Buttons row -->
  <rect x="268" y="214" width="130" height="40" rx="6" fill="#e50914"/>
  <text x="333" y="239" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">▶  Watch</text>

  <rect x="408" y="214" width="118" height="40" rx="6" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="467" y="239" fill="#f1f1f1" font-size="13" font-weight="500" text-anchor="middle">🎬  Trailer</text>

  <!-- Bookmark button -->
  <rect x="536" y="214" width="42" height="40" rx="6" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <path d="M550 222 L550 246 L557 240 L564 246 L564 222 Z" fill="none" stroke="#ccc" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Source selector -->
  <rect x="588" y="214" width="110" height="40" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="633" y="236" fill="#ccc" font-size="12" text-anchor="middle">VidSrc</text>
  <path d="M680 229 L686 235 L692 229" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- User score badges -->
  <rect x="268" y="264" width="72" height="22" rx="4" fill="#1a2a1a"/>
  <text x="304" y="279" fill="#48c774" font-size="11" text-anchor="middle" font-weight="600">★ 8.4 / 10</text>

  <!-- ── TOP NAV OVERLAY ─────────────────────────── -->
  <rect x="68" y="0" width="1212" height="54" fill="url(#navGrad)"/>
  <rect x="1038" y="12" width="210" height="32" rx="16" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="1058" y="33" fill="#555" font-size="13">🔍  Search titles...</text>
  <circle cx="1262" cy="28" r="16" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="1262" y="33" fill="#ccc" font-size="13" font-weight="600" text-anchor="middle">JD</text>

  <!-- ── PLAYER SECTION ──────────────────────────── -->
  <rect x="68" y="360" width="1212" height="220" fill="url(#playerGrad)"/>

  <!-- Player inner frame -->
  <rect x="88" y="375" width="1172" height="170" rx="8" fill="#000" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Play icon placeholder -->
  <circle cx="680" cy="460" r="28" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <polygon points="672,448 672,472 695,460" fill="#555"/>

  <!-- Click to watch label -->
  <text x="680" y="505" fill="#555" font-size="14" text-anchor="middle">Click Watch to load the player</text>

  <!-- Progress bar row -->
  <rect x="88" y="545" width="1172" height="1" fill="#222"/>

  <!-- Progress track -->
  <rect x="88" y="550" width="1172" height="5" rx="2.5" fill="#222"/>
  <!-- 35% progress -->
  <rect x="88" y="550" width="410" height="5" rx="2.5" fill="url(#progressBar)"/>
  <!-- Scrubber knob -->
  <circle cx="498" cy="552.5" r="7" fill="#e50914" stroke="#fff" stroke-width="1.5"/>

  <!-- Progress time labels -->
  <text x="88" y="575" fill="#555" font-size="11">0:00</text>
  <text x="1260" y="575" fill="#555" font-size="11" text-anchor="end">2:46:00</text>
  <text x="680" y="575" fill="#888" font-size="11" text-anchor="middle">58:04 / 2:46:00</text>

  <!-- Watch progress chips -->
  <rect x="88" y="588" width="66" height="24" rx="12" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
  <text x="121" y="604" fill="#666" font-size="11" text-anchor="middle">25%</text>
  <rect x="162" y="588" width="66" height="24" rx="12" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
  <text x="195" y="604" fill="#666" font-size="11" text-anchor="middle">50%</text>
  <rect x="236" y="588" width="66" height="24" rx="12" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
  <text x="269" y="604" fill="#666" font-size="11" text-anchor="middle">75%</text>
  <rect x="310" y="588" width="90" height="24" rx="12" fill="#1a2a1a" stroke="#2a3a2a" stroke-width="1"/>
  <text x="355" y="604" fill="#48c774" font-size="11" text-anchor="middle">✓ Watched</text>

  <!-- ── CAST / DETAILS SECTION ─────────────────── -->
  <rect x="88" y="624" width="1172" height="88" rx="8" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <text x="108" y="646" fill="#888" font-size="12" font-weight="600">CAST</text>
  <!-- Cast pills -->
  <rect x="108" y="653" width="110" height="22" rx="11" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="163" y="668" fill="#ccc" font-size="11" text-anchor="middle">Timothée Chalamet</text>
  <rect x="226" y="653" width="90" height="22" rx="11" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="271" y="668" fill="#ccc" font-size="11" text-anchor="middle">Zendaya</text>
  <rect x="324" y="653" width="100" height="22" rx="11" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="374" y="668" fill="#ccc" font-size="11" text-anchor="middle">Rebecca Ferguson</text>
  <rect x="432" y="653" width="90" height="22" rx="11" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="477" y="668" fill="#ccc" font-size="11" text-anchor="middle">Josh Brolin</text>

  <text x="108" y="698" fill="#555" font-size="12">Director: Denis Villeneuve  ·  Studio: Legendary Pictures  ·  Language: English  ·  Country: USA</text>
</svg>
